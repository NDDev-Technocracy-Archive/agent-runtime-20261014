# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@b5284b8a63b81c3bfec197d18ff8725616b12a25 # v0.6.65
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-24.04
      fetch-depth: 0
      setup: true
      go-version: '1.27.1'
      tools: zizmor@1.32.0
      tool-assets: .github/source-tools.json
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-26]
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@b5284b8a63b81c3bfec197d18ff8725616b12a25 # v0.6.65
    permissions:
      contents: read
    with:
      hosted-runner: ${{ matrix.os }}
      prepare: setup
      recipe: test
      go-version: '1.27.1'
      timeout-minutes: 30
  vulnerabilities:
    if: github.event_name == 'pull_request'
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@b5284b8a63b81c3bfec197d18ff8725616b12a25 # v0.6.65
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-24.04
      prepare: setup
      recipe: vulnerability-check
      go-version: '1.27.1'
      timeout-minutes: 30
